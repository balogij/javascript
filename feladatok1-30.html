        //10. feladat

    function Osszead2()
    {
        //alert("value is changed");
        var elso = parseInt(document.getElementById("elso").value);
        console.log(document.getElementById("elso").value);
        var masodik = parseInt(document.getElementById("masodik").value);
        console.log(document.getElementById("masodik").value);
        var osszeg = elso+masodik;
        console.log(osszeg);
        document.getElementById("osszeg").innerHTML= elso + "+" + masodik + "="+ osszeg;
    }
    function Osszead3()
    {
        //alert("value is changed");
        var elso = parseInt(document.getElementById("elso").value);
        var masodik = parseInt(document.getElementById("masodik").value);
        var harmadik = parseInt(document.getElementById("harmadik").value);
        var osszeg = elso+masodik+harmadik;
        document.getElementById("osszeg2").innerHTML= elso + "+" + masodik + "+" + harmadik + "="+ osszeg;
    }
    function Kivon()
    {
        var elso = parseInt(document.getElementById("elso").value);
        var masodik = parseInt(document.getElementById("masodik").value);
        var osszeg = elso-masodik;
        document.getElementById("osszeg").innerHTML= elso + "-" + masodik + "="+ osszeg;
    }
    function Szorzas()
    {
        var elso = parseInt(document.getElementById("elso").value);
        var masodik = parseInt(document.getElementById("masodik").value);
        var osszeg = elso*masodik;
        document.getElementById("osszeg").innerHTML= elso + "*" + masodik + "="+ osszeg;
    }
    function Osztas()
    {
        var elso = parseInt(document.getElementById("elso").value);
        var masodik = parseInt(document.getElementById("masodik").value);
        if(masodik!=0){
            var osszeg = elso/masodik;
            document.getElementById("osszeg").innerHTML= elso + "/" + masodik + "="+ osszeg;
        }
        else{
            document.getElementById("osszeg").innerHTML= "Nem lehet nullával osztani!";
        }
    }   
    </script>
