<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; }
        canvas { background: #333; border: 2px solid #555; cursor: pointer; }
        #ui { position: absolute; top: 20px; left: 20px; }
    </style>
</head>
<body>
	<div id="ui">
		<h2 id="phaseText">Fázis: Lerakás (Játékos 1)</h2>
		<div id="unitSelector">
			<button onclick="selectUnit('warrior')">Harcos (2 maradt)</button>
			<button onclick="selectUnit('archer')">Íjász (2 maradt)</button>
			<button onclick="selectUnit('priest')">Pap (1 maradt)</button>
			<button onclick="selectUnit('mage')">Mágus (1 maradt)</button>
		</div>
		<p id="statusMsg">Válassz egységet és kattints a térfeledre!</p>
		<div id="combatInfo" style="display: none; margin-top: 20px;">
			<h3>Kör sorrend:</h3>
			<ul id="turnOrderList" style="list-style: none; padding: 0;"></ul>
			<button onclick="endTurn()">Kör vége (Passz)</button>
		</div>		
	</div>
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <script src="game.js"></script>
</body>
</html>
